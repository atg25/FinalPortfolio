<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrew Gardner — AI Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Instrument+Serif:ital@0;1&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; scroll-behavior:smooth; }
    body { overflow-x:hidden; background:#F5F2ED; }

    @keyframes slideUp   { from { opacity:0; transform:translateY(28px) } to { opacity:1; transform:translateY(0) } }
    @keyframes fadeIn    { from { opacity:0 } to { opacity:1 } }
    @keyframes drawLine  { from { transform:scaleX(0) } to { transform:scaleX(1) } }
    @keyframes slideDown { from { opacity:0; transform:translateY(-14px) } to { opacity:1; transform:translateY(0) } }
    @keyframes scaleIn   { from { opacity:0; transform:scale(0.94) } to { opacity:1; transform:scale(1) } }
    @keyframes spin      { from { transform:rotate(0deg) } to { transform:rotate(360deg) } }
    @keyframes float     { 0%,100%{ transform:translateY(0) translateX(-50%) } 50%{ transform:translateY(7px) translateX(-50%) } }

    .a-nav   { animation: slideDown .55s cubic-bezier(.16,1,.3,1) .1s both }
    .a-meta  { animation: slideUp   .6s  cubic-bezier(.16,1,.3,1) .25s both }
    .a-name1 { animation: slideUp   .7s  cubic-bezier(.16,1,.3,1) .4s both }
    .a-name2 { animation: slideUp   .7s  cubic-bezier(.16,1,.3,1) .52s both }
    .a-line  { animation: drawLine  .7s  cubic-bezier(.16,1,.3,1) .68s both; transform-origin:left }
    .a-photo { animation: scaleIn   .8s  cubic-bezier(.16,1,.3,1) .55s both }
    .a-tag   { animation: slideUp   .6s  cubic-bezier(.16,1,.3,1) .82s both }
    .a-stats { animation: fadeIn    .6s  cubic-bezier(.16,1,.3,1) .95s both }
    .a-cta   { animation: slideUp   .6s  cubic-bezier(.16,1,.3,1) 1.05s both }
    .a-scroll{ animation: fadeIn .4s ease 1.6s both, float 2.4s ease-in-out 2s infinite }

    ::selection { background: var(--accent, #1D7A4E); color: var(--bg, #F5F2ED) }

    ::-webkit-scrollbar { width:8px }
    ::-webkit-scrollbar-track { background:transparent }
    ::-webkit-scrollbar-thumb { background:rgba(0,0,0,.12); border-radius:4px }
    ::-webkit-scrollbar-thumb:hover { background:rgba(0,0,0,.22) }

    @media (max-width: 900px) {
      .hero-grid    { grid-template-columns:1fr !important }
      .hero-sect    { padding:100px 24px 48px !important }
      .nav-bar      { padding:16px 20px !important }
      .nav-bar > div:last-child { gap:20px !important }
      .process-grid { grid-template-columns:1fr 1fr !important; gap:32px !important }
      .skills-grid  { grid-template-columns:1fr !important }
    }
    @media (max-width: 600px) {
      .process-grid { grid-template-columns:1fr !important }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="portfolio-components.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = {
  "theme": "light",
  "accentColor": "#1D7A4E",
  "fontPair": "technical",
  "nameCase": "mixed",
  "showPhoto": true
};

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme  = THEMES[tweaks.theme] || THEMES.light;
  const accent = tweaks.accentColor;
  const fp     = FONTS[tweaks.fontPair] || FONTS.technical;

  React.useEffect(() => { document.body.style.background = theme.bg; }, [theme.bg]);

  return (
    <div style={{
      background:theme.bg, color:theme.textPrimary, fontFamily:fp.body,
      minHeight:'100vh', transition:'background .4s ease, color .4s ease',
      '--accent':accent, '--bg':theme.bg,
    }}>
      <ScrollProgress accent={accent} />
      <CustomCursor accent={accent} />
      <Nav theme={theme} accent={accent} fp={fp} />

      <HeroSection tweaks={tweaks} theme={theme} accent={accent} fp={fp} />
      <MissionSection theme={theme} accent={accent} fp={fp} />
      <ProcessSection theme={theme} accent={accent} fp={fp} />
      <WorkSection theme={theme} accent={accent} fp={fp} />
      <SkillsSection theme={theme} accent={accent} fp={fp} />
      <ContactSection theme={theme} accent={accent} fp={fp} />

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={tweaks.theme}
          options={['dark','light']}
          onChange={v => setTweak('theme', v)} />

        <TweakSection label="Accent" />
        <TweakColor label="Color" value={tweaks.accentColor}
          options={['#1D7A4E','#D05A2A','#4A6FD0','#9B5DE5']}
          onChange={v => setTweak('accentColor', v)} />

        <TweakSection label="Typography" />
        <TweakSelect label="Font pairing" value={tweaks.fontPair}
          options={[
            {value:'technical', label:'Instrument Serif + Space Grotesk'},
            {value:'classic',   label:'Libre Baskerville + DM Sans'},
            {value:'avantgarde',label:'Syne + Space Grotesk'},
          ]}
          onChange={v => setTweak('fontPair', v)} />

        <TweakSection label="Hero" />
        <TweakRadio label="Name case" value={tweaks.nameCase}
          options={['upper','mixed']}
          onChange={v => setTweak('nameCase', v)} />
        <TweakToggle label="Show photo area" value={tweaks.showPhoto}
          onChange={v => setTweak('showPhoto', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
